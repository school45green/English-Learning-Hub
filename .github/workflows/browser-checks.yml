name: Browser checks
on:
  push:
    branches: [codex/navigation-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install testing browser
        run: |
          npm install --prefix "$RUNNER_TEMP/hub-browser" playwright@1.58.2
          "$RUNNER_TEMP/hub-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Test desktop and mobile against fictional records
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/hub-server.log" 2>&1 &
          cd "$RUNNER_TEMP/hub-browser"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium,devices} from 'playwright';

          const mock = `
          export function createClient() {
            return {
              auth: {
                signOut: async () => ({error:null}),
                getSession: async () => ({data:{session:null}}),
                getUser: async () => ({data:{user:new URLSearchParams(location.search).has('teacher')?{id:'teacher'}:null}})
              },
              storage:{from:()=>({list:async()=>({data:[{name:'resource'}]})})},
              from: (table) => ({
                select: () => ({
                  eq: () => ({maybeSingle: async () => ({data:{role:'teacher'}})}),
                  order: () => ({range: async () => ({data:({
                    school_classes:[{id:'c1',name:'Class A',course:'Mega Goal 1'},{id:'c2',name:'Class B',course:'Mega Goal 3'}],
                    students:[{id:'s1',class_id:'c1',full_name:'ريم'},{id:'s2',class_id:'c1',full_name:'أمل'},{id:'s3',class_id:'c2',full_name:'هند'}],
                    activities:[{id:'act',title:'Reading practice',course:'Mega Goal 1',unit_no:2,kind:'worksheet',max_attempts:1,quiz_revision:0,skill:'Reading',activity_targets:[{class_id:'c1'}],activity_student_targets:[]}]
                  })[table]||[]})})
                })
              }),
              rpc: async (name, args) => {
                if(name==='hub_fluency')return {data:[]};
                if(name==='hub_manage_quiz')return {data:args.p_action==='read'?[{id:'q1',prompt:'Read this question',choices:['A','B'],correct:'A',points:2}]:{versioned:false}};
                if(name==='hub_open_standing_link')return {data:'test-session'};
                if(name==='hub_standing_link')return {data:args.p_action==='status'?{principal:'pending',vice_principal:'pending'}:{link:'a'.repeat(64)}};
                if(name==='hub_redeem_leadership'){
                  if(sessionStorage.getItem('mockUsed'))return {error:{message:'used'}};
                  sessionStorage.setItem('mockUsed','1');
                  return {data:'test-session'};
                }
                if(name==='hub_leadership_session')return {data:{role:'principal',report:{classes:[],plans:[],results:[],honors:[]}}};
                if(name==='hub_leadership_report')return args.p_key==='test-only'?{data:{classes:[],plans:[],results:[],honors:[]}}:{error:{message:'Forbidden'}};
                if (name === 'hub_family') return {data:{student:{name:'طالبة تجريبية'},activities:[],plans:[],results:[],honors:[],messages:[]}};
                if (name === 'hub_login_classes') return {data:[{id:'test-class',name:'فصل وهمي',grade_level:'أول ثانوي'}]};
                if (name === 'hub_student_sign_in' && args.p_pin === '0042') return {data:{
                  token:'fictional-token',
                  dashboard:{student:{name:'طالبة تجريبية'},activities:[{id:'test',title:'Practice quiz',questions:[{id:'q1',prompt:'Choose an answer',choices:['True','False']}],attempts_used:0,max_attempts:1}],results:[]}
                }};
                if (name === 'hub_student_learning') return {data:{plans:[],honors:[]}};
                if (name === 'hub_save_activity_draft') return {data:1};
                if (name === 'hub_student_session' && args.p_activity) return {data:{score:1,max_score:1}};
                if (name === 'hub_student_session') return {data:{student:{name:'طالبة تجريبية'},activities:[],results:[{title:'Practice quiz',score:1,max_score:1}]}};
                return {data:null};
              }
            };
          }`;

          const browser = await chromium.launch();
          try {
            for (const [name, config] of [
              ['desktop', {viewport:{width:1440,height:900}}],
              ['mobile', devices['Pixel 7']]
            ]) {
              const context = await browser.newContext(config);
              const page = await context.newPage();
              const errors = [];
              page.on('pageerror', error => errors.push(error.message));
              await page.route('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@*/+esm', route =>
                route.fulfill({contentType:'application/javascript',headers:{'access-control-allow-origin':'*'},body:mock}));
              await page.goto('http://127.0.0.1:8765/', {waitUntil:'load'});
              assert.equal(await page.title(), 'English Learning Hub');
              const home=async()=>{
                await page.locator('header').waitFor();
                for(const id of ['secureToggle','studentToggle','familyToggle'])assert.ok(await page.locator('#'+id).isVisible());
                assert.equal(await page.locator('#sectionBoard').isVisible(),false);
                assert.equal(await page.getByRole('button',{name:'العودة إلى لوحة الأقسام'}).count(),0);
                assert.equal(await page.evaluate(()=>scrollY),0);
              };
              await home();
              const link='http://127.0.0.1:8765/#school-lead='+'a'.repeat(64);
              await page.goto(link);
              await page.locator('#leadExit').waitFor();
              assert.equal(await page.evaluate(()=>location.hash),'');
              await page.reload();
              await page.locator('#leadExit').click();
              await home();
              await page.goto(link);
              await page.locator('#leadExit').click();
              for(const role of ['principal','vice_principal']){
                await page.locator('#adminToggle').click();
                await page.locator('#leadLogin select').selectOption(role);
                await page.locator('#leadLogin input').fill('incorrect');
                await page.locator('#leadLogin button').click();
                await page.locator('#leadError').getByText(/تعذّر الدخول/).waitFor();
                await page.locator('#leadLogin input').fill('test-only');
                await page.locator('#leadLogin button').click();
                await page.locator('#leadExit').waitFor();
                for(let i=0;i<4;i++){
                  await page.locator('#detail [data-section]').nth(i).click();
                  assert.equal(await page.locator('#detail form').count(),0);
                  await page.locator('#detail [data-section-back]').click();
                }
                await page.locator('#leadExit').click();
                await home();
              }
              await page.locator('#familyToggle').click();
              await page.locator('#familyHome').click();
              await home();
              await page.locator('#homeWelcome button').click();
              assert.equal(await page.locator('#nav button').count(), 16);
              for (let i=0;i<16;i++) {
                await page.locator('#nav button').nth(i).click();
                assert.equal(await page.locator('#sectionBoard').isVisible(),false);
                assert.equal(await page.locator('#detail').isVisible(),true);
                assert.equal(await page.evaluate(() => scrollY),0);
                assert.equal(await page.locator('#detail input,#detail select,#detail textarea,#detail form').count(),0);
                assert.equal(await page.locator('#detail button').count(),1);
                await page.locator('#publicBack').click();
                assert.equal(await page.locator('#sectionBoard').isVisible(),true);
                assert.equal(await page.locator('#detail').isVisible(),false);
              }
              await page.locator('#sectionBoard > button').click();
              await page.locator('#studentToggle').click();
              const form = page.locator('#studentCodeForm');
              await form.locator('[name=grade]').selectOption({label:'أول ثانوي'});
              await form.locator('[name=class_id]').selectOption('test-class');
              await form.locator('[name=name]').fill('طالبة تجريبية');
              await form.locator('[name=pin]').fill('0042');
              await form.locator('button').click();
              const student = page.locator('#secureBody');
              await student.getByRole('button',{name:/أنشطتي/}).click();
              assert.equal(await student.locator('[data-section-board]').isVisible(),false);
              await page.getByText('Choose an answer').waitFor();
              await page.getByRole('radio',{name:'True'}).check();
              await page.getByText('حُفظت إجاباتك تلقائيًا.').waitFor();
              await page.getByRole('button',{name:'تسليم النشاط'}).click();
              await page.getByText('تم حفظ الدرجة: 1 / 1').waitFor();
              await student.locator('[data-section-back]').click();
              await student.getByRole('button',{name:/درجاتي/}).click();
              await page.locator('#myResults').getByText('Practice quiz', {exact:false}).waitFor();
              assert.equal(await page.evaluate(() => document.documentElement.scrollWidth <= innerWidth + 1), true);
              await page.locator('#secureLogout').click();
              await home();
              await page.goto('http://127.0.0.1:8765/?teacher=1');
              await page.locator('#secureToggle').click();
              const teacherNav = page.locator('#teacherNav');
              await teacherNav.waitFor();
              assert.equal(await teacherNav.locator('button').count(),16);
              for (let i=0;i<16;i++) {
                await teacherNav.locator('button').nth(i).click();
                await page.locator('#teacherSectionTitle').waitFor();
                await page.getByText('جارٍ تحميل القسم…').waitFor({state:'hidden'});
                assert.equal(await teacherNav.isVisible(),false);
                assert.equal(await page.evaluate(() => scrollY),0);
                if(i===15){
                  const section=page.locator('#teacherFluency');
                  for(const skill of ['listening','speaking','reading','writing']){
                    await section.locator('[data-skill='+skill+']').click();
                    await section.locator('[data-act=new]').click();
                    await section.locator('form input[name=title]').waitFor();
                    await section.locator('[data-act=back]').click();
                  }
                  await section.locator('[data-act=progress]').click();
                  await section.locator('[data-act=export]').waitFor();
                }
                if(i===14){
                  await page.locator('#manageLeadership [name=role]').selectOption('principal');
                  await page.locator('#manageLeadership [name=action]').selectOption('issue');
                  await page.locator('#manageLeadership button').click();
                  await page.locator('#copyLead').waitFor();
                  assert.equal(await page.locator('#leadKey').inputValue(),link);
                }
                if(i===1){
                  const rows=page.locator('#rosterList tr td:first-child');
                  assert.deepEqual(await rows.allTextContents(),['أمل','ريم']);
                  await page.locator('#rosterSearch').fill('ريم');
                  assert.deepEqual(await rows.allTextContents(),['ريم']);
                  await page.locator('#exportRoster [name=id]').selectOption('c2');
                  assert.deepEqual(await rows.allTextContents(),['هند']);
                }
                if(i===2){
                  const actions=page.locator('#quizList');
                  await page.locator('#qState').selectOption('منشور');
                  assert.equal(await actions.locator('article').count(),0);
                  await page.locator('#qState').selectOption('مسودة');
                  await actions.locator('[data-action=preview]').click();
                  await page.locator('#quizDetail').getByRole('radio',{name:'B'}).check();
                  await actions.locator('[data-action=results]').click();
                  await page.locator('#quizDetail').getByText(/نسبة الإنجاز/).waitFor();
                  await actions.locator('[data-action=copy]').click();
                  await page.getByText('حفظ نسخة كمسودة',{exact:true}).waitFor();
                  assert.equal(await page.locator('#newActivity [name=classId]:checked').count(),0);
                  await actions.locator('[data-action=edit]').click();
                  await page.locator('#newActivity [name=points]').fill('4');
                  await page.getByRole('button',{name:'حفظ تعديل الأسئلة'}).click();
                  await page.locator('#teacherMsg').getByText('حُفظت تعديلات الاختبار').waitFor();
                  page.once('dialog',d=>d.dismiss());
                  await actions.locator('[data-action=delete]').click();
                  assert.equal(await actions.locator('article').count(),1);
                }
                if(i===3){
                  for(const name of ['Mega Goal 1','Unit 2','Reading','Reading practice'])
                    await page.locator('summary').getByText(name,{exact:true}).or(page.locator('summary').filter({hasText:new RegExp('^'+name+'$')})).first().click();
                  await page.getByRole('button',{name:'تنزيل المرفق'}).waitFor();
                }
                await page.locator('#teacherBack').click();
                await teacherNav.waitFor();
              }
              await page.locator('#secureLogout').click();
              await home();
              await page.goto('http://127.0.0.1:8765/#family='+'a'.repeat(48));
              await page.locator('#familyLogin input').fill('1234');
              await page.locator('#familyLogin button').click();
              const family=page.locator('#familyData');
              for (let i=0;i<6;i++) {
                await family.locator('[data-section-board] button').nth(i).click();
                assert.equal(await family.locator('[data-section-board]').isVisible(),false);
                assert.equal(await family.locator('[data-section-panel]:visible').count(),1);
                assert.equal(await page.evaluate(() => scrollY),0);
                await family.locator('[data-section-back]').click();
              }
              await page.locator('#exitFamily').click();
              await home();
              assert.deepEqual(errors, []);
              console.log(name + ' browser checks passed');
              await context.close();
            }
          } finally {
            await browser.close();
          }
          JS
