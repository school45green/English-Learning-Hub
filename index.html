function learningPairs(value,skill,dayForIndex){
  return value.trim().split(/\r?\n/).filter(line=>line.trim()).map((line,i)=>{
    const parts=line.split('|').map(part=>part.trim());
    if(parts.length!==2||!parts[0]||!parts[1])throw new Error('اكتبي السؤال والإجابة في كل سطر وافصلي بينهما بالرمز |');
    return {skill,day:dayForIndex(i),prompt:parts[0],expected:parts[1]};
  });
}
function learningTasks(data,remedial){
  if(remedial){
    const words=learningPairs(data.vocabulary,'vocabulary',i=>Math.floor(i/4)+1);
    const grammar=learningPairs(data.grammar,'grammar',i=>4+i);
    if(words.length!==12||![2,3].includes(grammar.length))throw new Error('أضيفي 12 كلمة وتمرينَي قواعد أو ثلاثة.');
    return [...words,...grammar];
  }
  if(['reading','listening'].includes(data.mode))return learningPairs(data.practice,data.mode,()=>1);
  return [{skill:data.mode,day:1,prompt:data.practice.trim(),expected:null}];
}

async function readLearningFile(file){
  if(!file?.size)return {};
  if(file.size>1572864)throw new Error('الحد الأقصى للمرفق 1.5 ميغابايت.');
  const extensions={pdf:'application/pdf',mp3:'audio/mpeg',ogg:'audio/ogg',wav:'audio/wav',m4a:'audio/mp4',
    webm:'audio/webm',jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',mp4:'video/mp4'};
  const mime=extensions[file.name.split('.').pop().toLowerCase()];
  if(!mime)throw new Error('صيغة المرفق غير مدعومة.');
  const body=await new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result).split(',')[1]);
    reader.onerror=()=>reject(new Error('تعذّر قراءة الملف.'));
    reader.readAsDataURL(file);
  });
  return {p_mime:mime,p_base64:body};
}
const learningFileTypes={'application/pdf':'pdf','audio/mpeg':'mp3','audio/ogg':'ogg','audio/wav':'wav','audio/mp4':'m4a',
  'audio/webm':'webm','image/jpeg':'jpg','image/png':'png','video/mp4':'mp4'};
async function downloadLearningMedia(id,code){
  const file=await checked(client.rpc('hub_download_learning_media',{p_media:id,p_token:code?.token??null}));
  if(!file||!learningFileTypes[file.mime])throw new Error('المرفق غير متاح.');
  const bytes=Uint8Array.from(atob(file.body),x=>x.charCodeAt(0));
  download('English-Learning-Hub.'+learningFileTypes[file.mime],new Blob([bytes],{type:'application/octet-stream'}),'application/octet-stream');
}
function learningMediaButton(id,code){
  const control=document.createElement('button');
  control.className='action secondary';
  control.type='button';
  control.textContent='تنزيل المرفق';
  control.onclick=async()=>{
    control.disabled=true;
    try{await downloadLearningMedia(id,code)}
    catch(error){control.textContent=error.message}
    finally{control.disabled=false}
  };
  return control;
}
async function renderLearningTasks(code,version){
  const target=$('myLearning');
  if(!target)return;
  try{
    const data=await checked(client.rpc('hub_student_learning',{p_token:code?.token??null}));
    if(version!==viewVersion||!target.isConnected||!data)return;
    for(const plan of data.plans){
      const section=document.createElement('section');
      section.className='secure-card';
      const finished=plan.tasks.filter(task=>task.reviewed).length;
      section.innerHTML='<h3>'+safe(plan.title)+'</h3><p>الوحدة '+safe(plan.unit)+' · '+safe(plan.skill)+' · تم تقييم '+finished+' من '+plan.tasks.length+'</p>';
      const daily=new Map();
      for(const task of plan.tasks){
        if(!daily.has(task.day))daily.set(task.day,[]);
        daily.get(task.day).push(task);
      }
      for(const [day,tasks] of daily){
        const label=document.createElement('h4');
        label.textContent='اليوم '+day;
        section.append(label);
        for(const task of tasks){
          const question=document.createElement('div');
          question.className='secure-card';
          const prompt=document.createElement('p');
          prompt.lang='en';prompt.dir='auto';prompt.textContent=task.prompt;
          question.append(prompt);
          if(task.submitted){
            const result=document.createElement('p');
            result.textContent=task.reviewed?'النتيجة '+task.score+' / 100':'سُلّم وبانتظار المراجعة';
            question.append(result);
            if(task.feedback){
              const feedback=document.createElement('p');
              feedback.textContent=task.feedback;
              question.append(feedback);
            }
            if(task.media)question.append(learningMediaButton(task.media,code));
          }else{
            const answer=document.createElement('form');
            const speaking=task.skill==='speaking';
            const writing=task.skill==='writing';
            answer.innerHTML=(speaking?'':('<label>الإجابة<textarea name="response" lang="en" dir="auto" maxlength="6000" '+(writing?'':'required')+'></textarea></label>'))+
              (speaking||writing?'<label>'+ (speaking?'التسجيل الصوتي':'ملف PDF اختياري')+'<input type="file" name="upload" accept="'+(speaking?'.mp3,.ogg,.wav,.m4a,.webm':'.pdf')+'" '+(speaking?'required':'')+'></label>':'')+
              button('تسليم')+'<p role="status"></p>';
            const submit=answer.querySelector('button');
            const status=answer.querySelector('[role="status"]');
            answer.onsubmit=async event=>{
              event.preventDefault();
              const fields=new FormData(answer);
              submit.disabled=true;
              try{
                const media=await readLearningFile(fields.get('upload'));
                const result=await checked(client.rpc('hub_submit_learning_task',{p_token:code?.token??null,p_task:task.id,
                  p_response:fields.get('response'),...media}));
                if(!result)throw new Error('انتهت جلسة الدخول.');
                status.textContent=result.reviewed?'حُفظت الدرجة: '+result.score+' / 100':'تم تسليم المشاركة.';
                if(version===viewVersion)await studentLoad(code);
              }catch(error){status.textContent=error.message;submit.disabled=false}
            };
            question.append(answer);
          }
          section.append(question);
        }
      }
      target.append(section);
    }
    const board=$('myHonorDetails');
    if(board){
      board.innerHTML=table(['القسم','العنوان','الوصف','تاريخ الأسبوع'],data.honors.map(h=>[sections[h.category]?.[1],h.title,h.description,h.week_start]));
      for(const honor of data.honors.filter(h=>h.media||h.legacy&&!code)){
        const row=document.createElement('p');
        row.append(document.createTextNode(honor.title+' '),honor.media?learningMediaButton(honor.media,code):resourceButton('honors',honor.id,code));
        board.append(row);
      }
    }
  }catch(error){if(target.isConnected)target.textContent='تعذّر تحميل تدريبات الخطط.'}
}

function fetchTeacherSnapshot(){
  const pending=Promise.all([
    rows('school_classes','id,name,course,grade_level,archived_at'),rows('students','id,full_name,class_id,active'),
    rows('activities','id,title,kind,course,unit_no,skill,max_score,max_attempts,published,quiz_closed,quiz_removed,quiz_revision,activity_targets(class_id),activity_student_targets(student_id)'),
    rows('submissions','id,student_id,activity_id,score,submitted_at,status,attempt'),
    rows('hub_plans','id,student_id,kind,title,instructions,due_on,completed,unit_no,skill'),
    rows('honors','id,student_id,category,title,description,week_start,archived_at'),
    rows('parent_messages','id,student_id,message,teacher_reply,created_at'),
    rows('semester_archives','id,label,archived_at')
  ]);
  teacherSnapshot={pending,expires:Date.now()+15000};
  pending.catch(()=>{if(teacherSnapshot?.pending===pending)teacherSnapshot=null});
  return pending;
}

async function loadLearningReviews(kind,studentName,version){
  const root=$('learningReviews');
  try{
    const reviews=[];
    for(let from=0;;from+=500){
      const batch=await checked(client.rpc('hub_learning_reviews',{p_kind:kind}).range(from,from+499));
      if(version!==viewVersion||!root.isConnected)return;
      reviews.push(...batch);
      if(batch.length<500)break;
    }
    if(version!==viewVersion||!root.isConnected)return;
    const manual=reviews.filter(x=>['writing','speaking'].includes(x.skill));
    root.innerHTML=card('سجل التقييم وتحسّن الأداء',
      table(['الطالبة','الخطة','المهارة','السؤال','النتيجة','ملحوظة'],reviews.map(x=>[
        studentName(x.student_id),x.title,labels[x.skill]||x.skill,x.prompt,x.score==null?'بانتظار المراجعة':x.score+' / 100',x.feedback]))+
      (manual.length?form('reviewLearning',select('task','المشاركة',options(manual,x=>studentName(x.student_id)+' — '+x.title+' — '+x.prompt.slice(0,50)))+
        '<div id="reviewLearningResponse"></div>'+fields('score','الدرجة من 100','type="number" min="0" max="100"')+
        '<label>التغذية الراجعة<textarea name="feedback" maxlength="1500"></textarea></label>','اعتماد التقييم'):''));
    if(!$('reviewLearning'))return;
    const selectTask=$('reviewLearning').elements.task;
    selectTask.onchange=()=>{
      const item=manual.find(x=>x.id===selectTask.value);
      const response=$('reviewLearningResponse');
      response.replaceChildren();
      if(!item)return;
      const prompt=document.createElement('p');
      prompt.textContent=item.prompt;
      const answer=document.createElement('p');
      answer.textContent=item.response||'';
      response.append(prompt,answer);
      if(item.media)response.append(learningMediaButton(item.media,null));
      $('reviewLearning').elements.score.value=item.score??'';
      $('reviewLearning').elements.feedback.value=item.feedback??'';
    };
    bind('reviewLearning',({task,score,feedback})=>checked(client.rpc('hub_review_learning_task',{
      p_task:task,p_score:Number(score),p_feedback:feedback})));
  }catch(error){if(root.isConnected)root.textContent='تعذّر تحميل سجل التقييم.'}
}

const sessionSlot='EnglishLearningHub.leadSession';
async function openLead(invite,standing=false){
  $('adminToggle').click();
  const root=$('detail');
  root.querySelector('form').remove();
  const status=$('leadError');
  status.textContent='جارٍ فتح بوابة الإدارة…';
  try{
    const token=invite?await checked(client.rpc(standing?'hub_open_standing_link':'hub_redeem_leadership',{p_invite:invite})):sessionStorage.getItem(sessionSlot);
    if(!status.isConnected)return;
    sessionStorage.setItem(sessionSlot,token);
    const data=await checked(client.rpc('hub_leadership_session',{p_token:token}));
    if(!status.isConnected)return;
    renderLead(root,data.role,data.report,async()=>{
      sessionStorage.removeItem(sessionSlot);
      showHome();
      await client.rpc('hub_leadership_session',{p_token:token,p_logout:true});
    });
    const exit=$('leadExit');
    const verify=async()=>{
      if(!exit.isConnected){clearInterval(timer);document.removeEventListener('visibilitychange',verify);return}
      if(document.hidden)return;
      const {error}=await client.rpc('hub_leadership_session',{p_token:token});
      if(error&&exit.isConnected){
        clearInterval(timer);
        document.removeEventListener('visibilitychange',verify);
        if(error.code==='42501')sessionStorage.removeItem(sessionSlot);
        showHome();
      }
    };
    const timer=setInterval(verify,60000);
    document.addEventListener('visibilitychange',verify);
  }catch{
    if(!invite)sessionStorage.removeItem(sessionSlot);
    if(status.isConnected)status.textContent='تعذّر فتح الجلسة. افتحي الرابط الذي أرسلته المعلمة، أو تحققي معها من حالة تفعيله.';
  }
}

for(const a of activities){const box=document.createElement('div');box.className='secure-card';const title=document.createElement('h3');title.textContent=a.title||'نشاط';box.append(title);if(a.resource)box.append(resourceButton('units',a.id,code));const form=document.createElement('form');const questions=Array.isArray(a.questions)?a.questions:(Array.isArray(a.answer_key?.questions)?a.answer_key.questions:[]);if(a.attempts_used>=a.max_attempts){box.append('اكتملت المحاولات المتاحة.');$('myActivities').append(box);continue}if(!questions.length){const p=document.createElement('p');p.textContent='لا توجد أسئلة متاحة لهذا النشاط حاليًا.';box.append(p);$('myActivities').append(box);continue}questions.forEach((q,i)=>{const field=document.createElement('fieldset');const legend=document.createElement('legend');legend.textContent=q.question||q.prompt||'Question '+(i+1);field.append(legend);(q.options||q.choices||[]).forEach((opt,j)=>{const lab=document.createElement('label');lab.className='quiz-option';const input=document.createElement('input');input.type='radio';input.name='q'+i;input.value=String(j);input.required=true;input.checked=a.draft?.[q.id]===opt;lab.append(input,document.createTextNode(' '+(typeof opt==='string'?opt:opt.text||String(opt))));field.append(lab)});form.append(field)});const btn=document.createElement('button');btn.className='action';btn.textContent='تسليم النشاط';form.append(btn);const status=document.createElement('p');
let revision=a.draft_revision??0;
let save=Promise.resolve();
let submitting=false;
form.onchange=()=>{
  if(submitting)return;
  const values=new FormData(form);
  const answers=Object.fromEntries(questions.flatMap((q,i)=>{
    const key='q'+i;
    return values.has(key)?[[q.id,(q.options||q.choices)[Number(values.get(key))]]]:[];
  }));
  save=save.then(async()=>{
    if(version!==viewVersion)return;
    revision=await checked(client.rpc('hub_save_activity_draft',{p_token:code?.token??null,p_activity:a.id,p_answers:answers,p_revision:revision,p_attempt:Number(a.attempts_used)+1}));
    status.textContent='حُفظت إجاباتك تلقائيًا.';
  }).catch(()=>{status.textContent='تعذّر حفظ المسودة. أعيدي فتح النشاط أو سلّمي الإجابات عند الانتهاء.'});
};
form.onsubmit=async e=>{e.preventDefault();if(submitting)return;submitting=true;await save;const fd=new FormData(form);const answers=Object.fromEntries(questions.map((q,i)=>[q.id,String((q.options||q.choices||[])[Number(fd.get('q'+i))]) ]));btn.disabled=true;const {data:res,error:err}=await request('student_submit_quiz',code?{p_activity:a.id,p_answers:answers}:{p_activity_id:a.id,p_answers:answers});if(version!==viewVersion)return;if(err||!res){status.textContent=err?'تعذّر التسليم: '+err.message:'انتهت صلاحية الدخول. أعيدي فتح رابط الدعوة.';btn.disabled=false;submitting=false;return}status.textContent='تم حفظ الدرجة: '+res.score+' / '+res.max_score;await studentLoad(code).then(()=>{
  if(version===viewVersion&&$('studentActivityStatus'))$('studentActivityStatus').textContent='تم حفظ الدرجة: '+res.score+' / '+res.max_score;
}).catch(error=>{if(version===viewVersion)box.append(document.createTextNode(error.message))})};box.append(form,status);$('myActivities').append(box)}
$('myResults').innerHTML=results.length?results.map(r=>`<p>${safe(r.activity||r.title||'نشاط')} — <b>${safe(r.score)} / ${safe(r.max_score)}</b></p>`).join(''):'<p>لا توجد درجات مسجلة.</p>';
void renderLearningTasks(code,version);
}
let familyInvite='';
function readFamilyInvite(){
  const match=location.hash.match(/^#family=([0-9a-f]{48})$/);
  if(!match)return false;
  familyInvite=match[1];
  history.replaceState(null,'',location.pathname+location.search);
  return true;
}
readFamilyInvite();
function openFamily(){
  switchView(true);
  $('secureArea').classList.add('hidden');
  const demo=$('detail');
  demo.classList.remove('hidden');
  demo.innerHTML='<button class="action secondary" id="familyHome">الواجهة الرئيسية</button>';
  $('familyHome').onclick=showHome;
  const panel=document.createElement('div');
  panel.className='secure-card';
  panel.innerHTML='<h3>دخول الأسرة</h3><p>افتحي رابط الدعوة الخاص من المعلمة وأدخلي الرمز الرباعي.</p>'+
    '<form id="familyLogin"><label>الرمز الرباعي <input name="pin" type="password" dir="ltr" inputmode="numeric" maxlength="4" pattern="[0-9٠-٩۰-۹]{4}" required autocomplete="off"></label>'+
    '<button class="action">عرض بيانات الطالبة</button></form><p id="familyStatus" role="status"></p><div id="familyData"></div>';
  demo.append(panel);
  moveToPage($('familyHome'));
  if(!familyInvite){
    $('familyLogin').hidden=true;
    return;
  }
  const form=$('familyLogin');
  form.onsubmit=async e=>{
    e.preventDefault();
    const pin=form.elements.pin.value.replace(/[٠-٩۰-۹]/g,c=>String(c.charCodeAt(0)%16));
    form.reset();
    $('familyData').replaceChildren();
    await request(pin,null,form);
  };
  async function request(pin,message,source){
    const submit=source.querySelector('button');
    submit.disabled=true;
    try{
      const data=await checked(client.rpc('hub_family',{p_invite:familyInvite,p_pin:pin,p_message:message}));
      if(!panel.isConnected)return;
      if(!data){
        form.hidden=false;
        $('familyHome').hidden=false;
        $('familyData').replaceChildren();
        info('familyStatus','تعذّر الدخول. تحققي من الدعوة والرمز أو أعيدي المحاولة لاحقًا.',true);
        return;
      }
      info('familyStatus',message?'أُرسلت الرسالة':'');
      form.hidden=true;
      const root=$('familyData');
      const restore=root.dataset.activeSection ? Number(root.dataset.activeSection) : null;
      const pages=[['📝','الواجبات والأنشطة'],['🎯','الخطط العلاجية والإثرائية'],['📊','النتائج المعتمدة'],['🏆','التكريم'],['✉️','مراسلة المعلمة'],sections[15]];
      root.innerHTML=`<h3>${safe(data.student.name)}</h3><p>${safe(data.student.grade_level)} — ${safe(data.student.class_name)} — ${safe(data.student.course)}</p>`+sectionMenu(pages)+
        sectionPanel(pages[0][1],table(['النشاط','الوحدة','المهارة','التسليم'],(data.activities||[])
          .map(x=>[x.title,x.unit_no,x.skill,x.submitted?'سُلّم':'لم يُسلّم'])))+
        sectionPanel(pages[1][1],table(['الخطة','المسار','الوحدة','المهارة','الإرشادات','موعد الإنجاز','الحالة'],(data.plans||[])
          .map(x=>[x.title,labels[x.kind]||x.kind,x.unit_no,x.skill,x.instructions,x.due_on,x.completed?'مكتملة':'قيد التنفيذ'])))+
        sectionPanel(pages[2][1],table(['النشاط','الدرجة','من','التاريخ'],data.results.map(x=>[
          x.title,x.score,x.max_score,new Intl.DateTimeFormat('ar-SA',{dateStyle:'short',timeStyle:'short'}).format(new Date(x.submitted_at))
        ])))+
        sectionPanel(pages[3][1],table(['العنوان','التاريخ'],data.honors.map(x=>[x.title,x.week_start])))+
        sectionPanel(pages[4][1],table(['الرسالة','الرد'],data.messages.map(x=>[x.message,x.teacher_reply]))+
          '<form id="sendFamily"><label>رسالة <textarea name="message" required maxlength="1000"></textarea></label><button class="action">إرسال</button></form>')+
        sectionPanel(pages[5][1],'<div id="familyFluency"></div>')+
        '<button class="action secondary" id="exitFamily">تسجيل الخروج</button>';
      $('familyFluency').append(progressView(data.fluency));
      $('familyHome').hidden=true;
      installSectionBoard(root,restore);
      $('sendFamily').onsubmit=e=>{e.preventDefault();request(pin,e.target.elements.message.value,e.target)};
      $('exitFamily').onclick=showHome;
    }catch(e){
      if(panel.isConnected)info('familyStatus','تعذّر إكمال الطلب. أعيدي المحاولة لاحقًا.',true);
    }finally{submit.disabled=false}
  }
}
$('familyToggle').onclick=openFamily;
if(familyInvite)openFamily();
window.addEventListener('hashchange',()=>{
  if(!readFamilyInvite())return;
  switchView(false);
  openFamily();

const defaultLogout=$('secureLogout').onclick;
function defaultClose(){
 viewVersion++;
 teacherSection=null;
 teacherSnapshot=null;
 $('secureBody').replaceChildren();
 delete $('secureBody').dataset.activeSection;
 $('secureDashboard').classList.add('hidden');

let codeSession=null;
function leaveCodeSession(){
 const token=codeSession;
 codeSession=null;
 viewVersion++;
 $('secureBody').replaceChildren();
 delete $('secureBody').dataset.activeSection;
 $('secureDashboard').classList.add('hidden');
 $('authBox').classList.remove('hidden');

async function showStudentLogin(){
 leaveCodeSession();
 const version=viewVersion;
 switchView(true);
 $('secureLogin').hidden=true;
 $('studentCodeForm')?.remove();
 const form=document.createElement('form');
 form.id='studentCodeForm';
 form.innerHTML='<h3>دخول الطالبة</h3>'+
   select('grade','المرحلة','')+select('class_id','الفصل','')+
   fields('name','اسم الطالبة كما هو في الكشف','maxlength="200" autocomplete="name"')+
   fields('pin','الرمز الرباعي','type="password" dir="ltr" inputmode="numeric" maxlength="4" pattern="[0-9٠-٩۰-۹]{4}" autocomplete="off"')+
   button('دخول');
 $('authBox').prepend(form);
 $('secureLogout').onclick=()=>{leaveCodeSession();showHome()};
 $('closeSecure').onclick=()=>{leaveCodeSession();switchView(false)};
 const submit=form.querySelector('button');
 submit.disabled=true;
 info('secureError','');
 let classes;
 try{classes=await checked(client.rpc('hub_login_classes'))}
 catch{if(version===viewVersion)info('secureError','تعذّر تحميل الفصول. أعيدي فتح بوابة الطالبات.',true);return}
 if(version!==viewVersion)return;
 const grade=form.elements.grade;
 const classField=form.elements.class_id;
 for(const value of new Set(classes.map(c=>c.grade_level)))grade.add(new Option(value,value));
 grade.onchange=()=>{
    classField.length=1;
    for(const c of classes.filter(c=>c.grade_level===grade.value))classField.add(new Option(c.name,c.id));
 };
 submit.disabled=false;
 form.onsubmit=async e=>{
    e.preventDefault();
    const data=new FormData(form);
    const pin=String(data.get('pin')).replace(/[٠-٩۰-۹]/g,c=>String(c.charCodeAt(0)%16));
    form.elements.pin.value='';
    submit.disabled=true;
    try{
      const result=await checked(client.rpc('hub_student_sign_in',{p_class:data.get('class_id'),p_name:data.get('name'),p_pin:pin}));
      if(version!==viewVersion){
        if(result)void client.rpc('hub_student_session',{p_token:result.token,p_logout:true}).then(()=>{});
        return;
      }
      if(!result)throw new Error('تعذّر الدخول. تحققي من الفصل والاسم والرمز أو أعيدي المحاولة لاحقًا.');
      codeSession=result.token;
      await studentLoad({token:result.token},result.dashboard);
      if(version!==viewVersion)return;
      $('authBox').classList.add('hidden');
      $('secureDashboard').classList.remove('hidden');
      info('secureError','');
    }catch(error){if(version===viewVersion)info('secureError',error.message,true)}
    finally{submit.disabled=false}
 };
}
$('studentToggle').onclick=showStudentLogin;
